[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-rea-team"
version = "0.1.0"
description = "Static-only REA evidence and native Hermes MiniMax role review"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hermes-rea-team = "rea_team.cli:main"

[tool.setuptools]
packages = ["rea_team"]

[tool.setuptools.package-data]
rea_team = ["pins.json"]
